name: Verify Nexo.Code
on:
  push:
    branches:
      - design/editorial-nexocode-2026
      - design/digital-matter-immersive
      - feat/kinetic-interactions-transitions
      - feat/immersive-studio-v2
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Experience regression tests
        run: npm test
      - name: Production build
        run: npm run build
