name: Verify Nexo.Code
on:
  push:
    branches:
      - design/editorial-nexocode-2026
      - design/digital-matter-immersive
      - feat/kinetic-interactions-transitions
      - feat/immersive-studio-v2
      - fix/store-hover-visibility-and-contrast
      - feat/beyond-interface-cinematic
      - security/harden-headers-privacy-audit-2026
      - feat/nexo-matter-engine-v3
      - fix/manifesto-type-and-silk-cursor
      - fix/unified-contact-form-fluid-cursor-v4
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Security audit of production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Experience regression tests
        run: npm test
      - name: Production build
        run: npm run build
